<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- Solid black status bar: "black-translucent" makes iOS size standalone apps 47pt short (black strip at the bottom). -->
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="210" />
<title>210</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="app-header">
  <button id="backBtn" class="icon-btn" hidden aria-label="Back">&lsaquo;</button>
  <h1 id="headerTitle">210</h1>
  <div id="headerRight"></div>
</header>

<main id="app"></main>

<button id="activeBar" class="active-bar" data-act="open-sheet" hidden>
  <span class="dot"></span>
  <span id="activeBarName">Workout</span>
  <span id="activeBarTime" class="mono">0:00</span>
</button>

<nav class="tabbar">
  <button data-tab="workout" class="tab">
    <svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>
    <span>Workout</span>
  </button>
  <button data-tab="history" class="tab">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <span>History</span>
  </button>
  <button data-tab="exercises" class="tab">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span>Exercises</span>
  </button>
  <button data-tab="progress" class="tab">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Progress</span>
  </button>
</nav>

<section id="sheet" class="sheet" data-doc="active" hidden></section>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" hidden></div>
<input id="importFile" type="file" accept="application/json,.json" hidden />

<script type="module" src="app.js"></script>
</body>
</html>
